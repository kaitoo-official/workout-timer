name: WorkoutProbe
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: '1'
targets:
  WorkoutProbe:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PROBE_BUNDLE_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 筋トレ検証
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    dependencies:
      - target: ProbeActivity
  ProbeActivity:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PROBE_BUNDLE_ID}.activity
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 筋トレ進行
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  WorkoutProbe:
    build:
      targets:
        WorkoutProbe: all
