# Codemagic workflows. All are started manually (no triggers).
# probe-*: the iOS background probe kept for reference (sources in probe/).
# core-tests: unit tests for the app's progression core (Packages/WorkoutCore).
# compile-app / signed-app: the workout-timer app (app/). Until the app name is decided, signed
# builds reuse the probe identifiers, profiles and App Store Connect record (internal TestFlight).
# Pocket Base settings are only referenced (the shared App Store Connect API key);
# nothing here changes Pocket Base's identifiers, certificate or profiles.
workflows:
  compile-app:
    name: App - unit tests and unsigned compile
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.6
      vars:
        APP_BUNDLE_ID: com.example.workouttimer
    scripts:
      - name: WorkoutCore unit tests
        script: |
          set -euo pipefail
          cd Packages/WorkoutCore
          swift test 2>&1 | tail -n 5
      - name: Generate project
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app
          xcodegen generate
      - name: Compile app and extension
        script: |
          set -euo pipefail
          cd app
          xcodebuild -project WorkoutTimer.xcodeproj -scheme WorkoutTimer             -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO -derivedDataPath build build 2>&1 | tee /tmp/compile-app.log | grep -E "error:|warning: .*WorkoutTimer|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/WorkoutTimer.app/PlugIns/WorkoutActivity.appex
    artifacts:
      - /tmp/compile-app.log

  signed-app:
    name: App - signed build to App Store Connect (internal TestFlight only)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: pocket-base-asc
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kaitooofficial.workoutprobe
      vars:
        APP_BUNDLE_ID: com.kaitooofficial.workoutprobe
    scripts:
      - name: WorkoutCore unit tests
        script: |
          set -euo pipefail
          cd Packages/WorkoutCore
          swift test 2>&1 | tail -n 5
      - name: Generate project and apply profiles
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app
          xcodegen generate
          xcode-project use-profiles
      - name: Build signed archive
        script: |
          set -euo pipefail
          cd app
          xcode-project build-ipa --project WorkoutTimer.xcodeproj --scheme WorkoutTimer             --archive-xcargs "CURRENT_PROJECT_VERSION=$((BUILD_NUMBER + 100)) COMPILER_INDEX_STORE_ENABLE=NO"
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. No beta review / external testing / App Store submission.
        submit_to_testflight: false

  core-tests:
    name: WorkoutCore unit tests
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: 26.6
    scripts:
      - name: Run swift test
        script: |
          set -euo pipefail
          cd Packages/WorkoutCore
          swift --version
          swift test 2>&1 | tee /tmp/core-tests.log
    artifacts:
      - /tmp/core-tests.log

  compile-probe:
    name: Compile iOS probe (no signing or upload)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.6
      vars:
        # Placeholder only; this workflow never signs. xcodegen substitutes it at generate time.
        PROBE_BUNDLE_ID: com.example.workoutprobe
    scripts:
      - name: Generate project and record toolchain
        script: |
          set -euo pipefail
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
          cd probe
          xcodegen generate
      - name: Compile app and extension
        script: |
          set -euo pipefail
          cd probe
          xcodebuild -project WorkoutProbe.xcodeproj -scheme WorkoutProbe \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build build 2>&1 | tee /tmp/compile.log
          ls build/Build/Products/Release-iphoneos/WorkoutProbe.app/PlugIns
    artifacts:
      - probe/build/Build/Products/Release-iphoneos/*.app
      - /tmp/compile.log

  setup-signing:
    name: One-time signing setup (bundle IDs and App Store profiles)
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: pocket-base-asc
    environment:
      vars:
        PROBE_BUNDLE_ID: com.kaitooofficial.workoutprobe
    scripts:
      - name: Register probe identifiers and create profiles (never deletes or revokes)
        script: python3 probe/scripts/setup_signing.py "$PROBE_BUNDLE_ID"

  signed-probe:
    name: Signed probe to App Store Connect (internal TestFlight only)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: pocket-base-asc
    environment:
      xcode: 26.6
      # Certificate "workout-probe-distribution" and the probe profiles are stored in
      # Codemagic Code signing identities; this fetches those for the app and its extensions.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kaitooofficial.workoutprobe
      vars:
        PROBE_BUNDLE_ID: com.kaitooofficial.workoutprobe
    scripts:
      - name: Validate separate app identifier and generate project
        script: |
          set -euo pipefail
          if [[ "$PROBE_BUNDLE_ID" == com.kaitooofficial.pocketbase* || "$PROBE_BUNDLE_ID" == com.example.* ]]; then
            echo 'Use the separate probe identifier.'; exit 1
          fi
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          cd probe
          xcodegen generate
      - name: Apply profiles to the project
        script: cd probe && xcode-project use-profiles
      - name: Build signed archive
        script: |
          set -euo pipefail
          cd probe
          xcode-project build-ipa --project WorkoutProbe.xcodeproj --scheme WorkoutProbe             --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER COMPILER_INDEX_STORE_ENABLE=NO"
    artifacts:
      - probe/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. No beta review / external testing / App Store submission.
        submit_to_testflight: false
